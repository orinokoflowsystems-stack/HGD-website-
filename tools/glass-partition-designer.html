<head>

<title>Glass Partition Designer | Handy Glass &amp; Door</title>

var l=q.get("lang");if(l==="es"||l==="en"){try{localStorage.setItem("hgd-gp-lang",l)}catch(e){}}})();

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* HGD website copy of the Glass Partitions app (public, no Claude runtime). */
/* Layout: drafting-table app — elevation drawing on top, spec sheet beside/below, four tabs (Designs · My space · Configurator · Quote), ES/EN toggle */
:root{
  --bg:#F4F7FA; --paper:#FFFFFF; --ink:#16232F; --muted:#546576; --line:#D8E1E8;
  --accent:#0F2B4C; --accent-ink:#FFFFFF; --accent-soft:#F3E7C9; --wall:#E4EDF3; --dim:#24466D; --gold:#C99A3B;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand small{display:block;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font:700 clamp(28px,6vw,40px)/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 20px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 16px/1.25 var(--display);margin:0}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:9px 14px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lede{color:var(--muted);max-width:62ch;margin:0}
/* gallery */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .thumb{background:var(--wall);border-bottom:1px solid var(--line)}
.card .thumb svg{display:block;width:100%;height:auto}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.space{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.card p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px/1 var(--body);padding:5px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.from{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 14px var(--body);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
/* configurator */
.config{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.config{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.drawing{background:var(--wall);border-radius:8px;overflow-x:auto}
.drawing svg{display:block;width:100%;min-width:320px;height:auto}
.legend{font:400 12px var(--mono);color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
legend,label.lab{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer;background:var(--paper)}
.opts input:checked+label{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opts input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{display:flex;flex-direction:column;gap:6px}
input[type=number],input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.spec{width:100%;border-collapse:collapse;font-size:14px}
.spec td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.spec td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.price{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.price .big{font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.price small{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* quote */
.quote{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.quote{grid-template-columns:1fr}}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
pre.summary{white-space:pre-wrap;font:13px/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;overflow-x:auto}
.contact{font:500 15px var(--mono);user-select:all}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{font-size:13px;color:var(--accent);min-height:1.2em;margin:0}
.err{color:#b3261e;font-size:13px;margin:0}
.tabs{overflow-x:auto;max-width:100%}
.stage{position:relative;background:var(--wall);border-radius:8px;min-height:240px;overflow:hidden;touch-action:none}
.stage img{display:block;width:100%;height:auto}
.stage .empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:14px}
.stage .empty strong{color:var(--ink);font:600 16px/1.3 var(--display);max-width:30ch}
.ov{position:absolute;cursor:grab;outline:1.5px dashed rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.ov:active{cursor:grabbing}
.ov svg{display:block;width:100%;height:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
label.btn{display:inline-flex;align-items:center}
.rec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.rec ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink)}
.docwrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
@media (prefers-reduced-motion:no-preference){.tabs button{transition:background .15s}}

.headr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;min-width:0;max-width:100%}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px/1 var(--mono);letter-spacing:.08em;padding:7px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stack{display:flex;flex-direction:column;gap:14px}
.ov{left:0;top:0;transform-origin:0 0;outline:none;box-shadow:none;cursor:move}
.ov::after{content:"";position:absolute;inset:0;outline:1.5px dashed rgba(255,255,255,.85)}
.hdl{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid #fff;background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:grab;padding:0;touch-action:none;z-index:2}
.hdl:focus-visible{outline:2px solid #fff;outline-offset:2px}
.stage.has{min-height:0}
.framectl{display:flex;flex-direction:column;gap:8px}
.projbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.projbar select,.projbar input{width:auto;min-width:0;flex:1 1 180px;max-width:320px;padding:7px 9px}
.badge{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge[data-mode="cloud"]{border-color:var(--accent);color:var(--accent)}
button.badge{background:transparent;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:#b3261e;border-color:#b3261e;color:#fff}
.viewbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.viewbar .legend{flex:1 1 auto}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
#cov{pointer-events:none}
#cstage{touch-action:auto}
#cov::after{display:none}
.segtabs{display:flex;flex-wrap:wrap;gap:6px}
.segb{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 13px var(--body);padding:7px 11px;border-radius:8px;cursor:pointer}
.segb small{font:400 11px var(--mono);color:var(--muted)}
.segb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.segb.add{border-style:dashed;color:var(--accent)}
.segb.rm{color:#b3261e;border-color:transparent;background:transparent}
.ovs{position:absolute;inset:0;pointer-events:none}
.ov.other{pointer-events:auto;cursor:pointer;opacity:.8}
#cstage .ov.other{pointer-events:none}
.ov.other::after{outline:1px dashed rgba(255,255,255,.6)}
.segtags{position:absolute;inset:0;pointer-events:none;z-index:3}
.segtag{position:absolute;transform:translate(6px,6px);font:700 12px/1 var(--mono);background:rgba(20,32,31,.75);color:#fff;padding:4px 6px;border-radius:4px}
.segtag.on{background:var(--accent);color:var(--accent-ink)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--gold)}
.embedded body,html.embedded body{padding-block:8px 24px}
html.embedded header .brand{display:none}
html.embedded header{justify-content:flex-end}
#projbar{display:none!important}
.sendrow{display:flex;flex-wrap:wrap;gap:8px}
.btn.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0A1F37}
</style>

<body>
<div class="wrap">
  <header>
    <div class="brand">
      <small>Handy Glass &amp; Door · Central Florida</small>
      <h1>Glass Partitions</h1>
    </div>
    <div class="headr">
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <nav class="tabs" role="tablist" data-i18n-aria="tabsAria">
        <button role="tab" id="t-gal" aria-selected="true" data-tab="gal" data-i18n="tabGal"></button>
        <button role="tab" id="t-spc" aria-selected="false" data-tab="spc" data-i18n="tabSpc"></button>
        <button role="tab" id="t-cfg" aria-selected="false" data-tab="cfg" data-i18n="tabCfg"></button>
        <button role="tab" id="t-quo" aria-selected="false" data-tab="quo" data-i18n="tabQuo"></button>
      </nav>
    </div>
  </header>

  <div class="projbar" id="projbar" hidden>
    <label class="lab" for="projSel" data-i18n="project"></label>
    <select id="projSel"></select>
    <input id="projName" type="text" maxlength="60" hidden data-i18n-aria="rename">
    <div class="actions" id="projBtns">
      <button class="btn ghost sm" type="button" id="projRename" data-i18n="rename"></button>
      <button class="btn ghost sm" type="button" id="projNew" data-i18n="newProject"></button>
      <button class="btn ghost sm" type="button" id="projDel" data-i18n="delete"></button>
    </div>
    <div class="actions" id="projConfirm" hidden>
      <span class="note" data-i18n="confirmDel"></span>
      <button class="btn sm danger" type="button" id="projDelYes" data-i18n="yesDelete"></button>
      <button class="btn ghost sm" type="button" id="projDelNo" data-i18n="cancel"></button>
    </div>
    <button type="button" class="badge" id="syncBadge"></button>
    <span class="note" id="projSaved" aria-live="polite"></span>
  </div>

  <!-- MY SPACE -->
  <section id="spc" role="tabpanel" aria-labelledby="t-spc" hidden>
    <div class="config">
      <div class="panel">
        <div class="legend"><span data-i18n="photoLegend"></span><span data-i18n="dragHint"></span></div>
        <div class="stage" id="stage">
          <img id="photo" alt="" hidden>
          <div class="ov" id="ov" hidden></div>
          <div id="handles" hidden>
            <button type="button" class="hdl" data-c="0" aria-label="TL"></button>
            <button type="button" class="hdl" data-c="1" aria-label="TR"></button>
            <button type="button" class="hdl" data-c="2" aria-label="BL"></button>
            <button type="button" class="hdl" data-c="3" aria-label="BR"></button>
          </div>
          <div class="empty" id="stageEmpty">
            <strong data-i18n="emptyTitle"></strong>
            <span data-i18n="emptyBody"></span>
          </div>
        </div>
        <div class="actions">
          <label class="btn" for="cam" tabindex="0" id="camLbl" data-i18n="takePhoto"></label>
          <input id="cam" type="file" accept="image/*" capture="environment" hidden>
          <label class="btn ghost" for="gal-file" tabindex="0" id="galLbl" data-i18n="uploadPhoto"></label>
          <input id="gal-file" type="file" accept="image/*" hidden>
        </div>
        <div id="boxCtl" hidden class="framectl">
          <div class="segtabs" role="group" data-i18n-aria="sSegs"></div>
          <p class="note" data-i18n="segHelp"></p>
          <p class="note" data-i18n="frameHelp"></p>
          <div class="actions"><button class="btn ghost" id="frameReset" type="button" data-i18n="frameReset"></button></div>
          <p class="note mono" id="frameInfo"></p>
        </div>
      </div>

      <aside class="panel">
        <h2 data-i18n="bySpaceTitle"></h2>
        <fieldset><legend data-i18n="spaceType"></legend><div class="opts" id="o-space"></div></fieldset>
        <fieldset><legend data-i18n="privacy"></legend><div class="opts" id="o-priv"></div></fieldset>
        <fieldset><legend data-i18n="style"></legend><div class="opts" id="o-style"></div></fieldset>
        <div class="row2">
          <div class="num"><label class="lab" for="sw" data-i18n="approxW"></label><input id="sw" type="number" min="6" max="40" step="0.5" data-i18n-ph="auto"></div>
          <div class="num"><label class="lab" for="sh" data-i18n="approxH"></label><input id="sh" type="number" min="7" max="12" step="0.5" data-i18n-ph="auto"></div>
        </div>
        <div class="actions">
          <button class="btn" id="aiBtn" hidden data-i18n="aiBtn"></button>
          <button class="btn ghost" id="ruleBtn" data-i18n="ruleBtn"></button>
          <button class="btn ghost" id="aiStop" hidden data-i18n="stop"></button>
        </div>
        <p class="toast" id="spcMsg" aria-live="polite"></p>
        <div id="rec" hidden class="rec">
          <span class="space" id="recSpace"></span>
          <h3 id="recName"></h3>
          <ul id="recWhy"></ul>
          <table class="spec"><tbody id="recSpec"></tbody></table>
          <p class="note" id="recNote"></p>
          <div class="actions"><button class="btn" id="useRec" data-i18n="useInCfg"></button><button class="btn ghost" id="quoteRec" data-i18n="makeEstimate"></button></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- GALLERY -->
  <section id="gal" role="tabpanel" aria-labelledby="t-gal" class="stack">
    <p class="lede" data-i18n="lede"></p>
    <div class="grid" id="grid"></div>
  </section>

  <!-- CONFIGURATOR -->
  <section id="cfg" role="tabpanel" aria-labelledby="t-cfg" hidden>
    <div class="config">
      <div class="panel">
        <div class="viewbar">
          <div class="legend"><span id="cfgLegend" data-i18n="elevation"></span><span id="cfgLegend2" data-i18n="scaleNote"></span></div>
          <div class="seg" id="viewSeg" hidden>
            <button type="button" data-view="photo" aria-pressed="true" data-i18n="viewPhoto"></button>
            <button type="button" data-view="plan" aria-pressed="false" data-i18n="viewPlan"></button>
          </div>
        </div>
        <div class="drawing" id="drawing"></div>
        <div class="stage has" id="cstage" hidden><img id="cphoto" alt=""><div class="ov" id="cov"></div></div>
        <div class="actions" id="cstageAct" hidden><button class="btn ghost sm" type="button" id="adjFrame" data-i18n="adjustFrame"></button></div>
        <div class="segtabs" role="group" data-i18n-aria="sSegs"></div>
        <fieldset><legend data-i18n="system"></legend><div class="opts" id="o-system"></div></fieldset>
        <fieldset><legend data-i18n="glass"></legend><div class="opts" id="o-glass"></div></fieldset>
        <fieldset><legend data-i18n="finish"></legend><div class="opts" id="o-finish"></div></fieldset>
        <fieldset><legend data-i18n="door"></legend><div class="opts" id="o-door"></div></fieldset>
        <fieldset id="fs-doorpos"><legend data-i18n="doorPos"></legend><div class="opts" id="o-doorpos"></div></fieldset>
        <div class="row2">
          <div class="num"><label class="lab" for="w" data-i18n="widthFt"></label><input id="w" type="number" min="6" max="40" step="0.5"></div>
          <div class="num"><label class="lab" for="h" data-i18n="heightFt"></label><input id="h" type="number" min="7" max="12" step="0.5"></div>
        </div>
        <label class="toggle"><input id="band" type="checkbox"> <span data-i18n="bandToggle"></span></label>
      </div>

      <aside class="panel">
        <h2 id="specName"></h2>
        <table class="spec"><tbody id="spec"></tbody></table>
        <div class="price">
          <span class="lab" data-i18n="installedEst"></span>
          <span class="big" id="price">—</span>
          <small data-i18n="priceNote"></small>
        </div>
        <div class="actions">
          <button class="btn" id="toQuote" data-i18n="requestQuote"></button>
          <button class="btn ghost" id="reset" data-i18n="reset"></button>
        </div>
      </aside>
    </div>
  </section>

  <!-- QUOTE -->
  <section id="quo" role="tabpanel" aria-labelledby="t-quo" hidden>
    <div class="quote">
      <div class="panel">
        <h2 data-i18n="projectData"></h2>
        <form id="qform" novalidate>
          <div class="field"><label class="lab" for="q-name" data-i18n="fName"></label><input id="q-name" type="text" autocomplete="name" required></div>
          <div class="row2">
            <div class="field"><label class="lab" for="q-phone" data-i18n="fPhone"></label><input id="q-phone" type="tel" autocomplete="tel" required></div>
            <div class="field"><label class="lab" for="q-email" data-i18n="fEmail"></label><input id="q-email" type="email" autocomplete="email"></div>
          </div>
          <div class="field"><label class="lab" for="q-city" data-i18n="fCity"></label><input id="q-city" type="text" data-i18n-ph="cityPh"></div>
          <div class="field"><label class="lab" for="q-space" data-i18n="fSpace"></label><select id="q-space"></select></div>
          <div class="field"><label class="lab" for="q-notes" data-i18n="fNotes"></label><textarea id="q-notes" rows="3" data-i18n-ph="notesPh"></textarea></div>
          <p class="err" id="qerr" hidden></p>
          <button class="btn" type="submit" data-i18n="makeEstimate"></button>
        </form>
      </div>

let cfg={...DEFAULT}, cfgSrc={type:"preset",id:"exec",adj:false};

function srcName(s){
  let n= s.type==="preset"?L(PRESETS.find(p=>p.id===s.id).name)
    : s.type==="rule"?`${L(SPACES[s.space].label)} · ${L(STYLE[s.style].label).split(" ")[0]}`
    : s.type==="text"?s.text : t("custom");
  return n+(s.adj?t("adjusted"):"");
}

function ftin(v){const f=Math.floor(v+1e-9);const i=Math.round((v-f)*12);return `${f}′-${i}″`}
function fmt(n){return "$"+(Math.round(n/50)*50).toLocaleString("en-US")}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}

function estimateRaw(c){
  const area=c.w*c.h, s=SYSTEMS[c.system], g=GLASS[c.glass], f=FINISH[c.finish], d=DOOR[c.door];
  return area*(s.rate+g.add)*f.mult + d.cost + (c.band&&c.glass!=="frosted"?c.w*BAND_LF:0);
}
function estimate(c){const base=Math.max(estimateRaw(c),MIN_PROJECT);return {area:c.w*c.h,base,low:base*.88,high:base*1.12}}
function projectCost(cs){const base=Math.max(cs.reduce((x,c)=>x+estimateRaw(c),0)+JOINT*(cs.length-1),MIN_PROJECT);return {base,low:base*.88,high:base*1.12}}
function panelsOf(c){
  const dw=Math.min(DOOR[c.door].w, c.w-2);
  const rest=c.w-dw, mod=SYSTEMS[c.system].mod;
  const list=[];
  const pos=c.doorPos||"center";
  if(dw&&pos!=="center"){const n=Math.max(1,Math.ceil(rest/mod)),pw=rest/n;const side=[];for(let i=0;i<n;i++)side.push({w:pw});if(pos==="left")list.push({w:dw,door:true},...side);else list.push(...side,{w:dw,door:true})}
  else if(dw){const side=Math.max(1,Math.ceil((rest/2)/mod)),pw=(rest/2)/side;for(let i=0;i<side;i++)list.push({w:pw});list.push({w:dw,door:true});for(let i=0;i<side;i++)list.push({w:pw})}
  else{const n=Math.max(2,Math.ceil(rest/mod));for(let i=0;i<n;i++)list.push({w:rest/n})}
  return list;
}

function render(c,opt={}){
  let VW=620,VH=330, padL=34,padR=56,padT=22,padB=58;
  if(opt.overlay){padL=padR=padT=padB=0;VW=c.w*40;VH=c.h*40}
  const s=Math.min((VW-padL-padR)/c.w,(VH-padT-padB)/c.h);
  const W=c.w*s,H=c.h*s, x0=padL+((VW-padL-padR)-W)/2, y0=padT+((VH-padT-padB)-H)/2, yF=y0+H;
  const fc=FINISH[c.finish].color, gfill=GLASS[c.glass].fill;
  const thick=c.system==="frameless"?0:(c.system==="loft"?5:3.5);
  let o=`<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(t("elevation"))}"${opt.overlay?' preserveAspectRatio="none"':""}>`;
  o+=`<defs><pattern id="flute" width="7" height="10" patternUnits="userSpaceOnUse"><rect width="7" height="10" fill="rgba(215,232,232,.75)"/><rect width="3" height="10" fill="rgba(160,195,200,.55)"/></pattern>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--muted)" stroke-width="1" opacity=".5"/></pattern></defs>`;
  if(!opt.overlay){
    o+=`<rect x="0" y="${y0-8}" width="${VW}" height="8" fill="url(#hatch)"/><line x1="0" y1="${y0}" x2="${VW}" y2="${y0}" style="stroke:var(--muted)" stroke-width="1"/>`;
    o+=`<rect x="0" y="${yF}" width="${VW}" height="9" fill="url(#hatch)"/><line x1="0" y1="${yF}" x2="${VW}" y2="${yF}" style="stroke:var(--ink)" stroke-width="1.5"/>`;
  }
  const panels=panelsOf(c); let x=x0;
  const transomY = c.system==="modular" && c.h>8 ? yF-7.5*s : null;
  panels.forEach((p,i)=>{
    const pw=p.w*s;
    o+=`<rect x="${x}" y="${y0}" width="${pw}" height="${H}" fill="${gfill}"/>`;
    o+=`<line x1="${x+pw*.18}" y1="${y0+H*.12}" x2="${x+pw*.45}" y2="${y0+H*.02+8}" stroke="rgba(255,255,255,.55)" stroke-width="2"/>`;
    if(c.band && c.glass!=="frosted"){o+=`<rect x="${x}" y="${yF-5.5*s}" width="${pw}" height="${2*s}" fill="rgba(240,245,245,.8)"/>`}
    if(c.system==="loft"){
      const rows=c.h>9?4:3;
      for(let r=1;r<rows;r++){const yy=y0+H*r/rows;o+=`<rect x="${x}" y="${yy-1.5}" width="${pw}" height="3" fill="${fc}"/>`}
      if(!p.door&&pw>40){o+=`<rect x="${x+pw/2-1.5}" y="${y0}" width="3" height="${H}" fill="${fc}"/>`}
    }
    if(transomY){o+=`<rect x="${x}" y="${transomY-2}" width="${pw}" height="4" fill="${fc}"/>`}
    if(thick){o+=`<rect x="${x+thick/2}" y="${y0+thick/2}" width="${pw-thick}" height="${H-thick}" fill="none" stroke="${fc}" stroke-width="${thick}"/>`}
    else if(i>0){o+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${yF}" stroke="rgba(120,150,155,.7)" stroke-width="1"/>`}
    if(p.door){
      const top=transomY?transomY:y0;
      const dTop=Math.max(top, yF-7*s);
      if(dTop>y0+2 && !transomY){o+=`<rect x="${x}" y="${dTop-2}" width="${pw}" height="${thick||3}" fill="${fc}"/>`}
      const leaves=c.door==="double"?2:1, lw=pw/leaves;
      for(let l=0;l<leaves;l++){
        const lx=x+l*lw;
        o+=`<rect x="${lx+2}" y="${dTop+2}" width="${lw-4}" height="${yF-dTop-4}" fill="none" stroke="${fc}" stroke-width="1.6"/>`;
        const hingeLeft = leaves===2 ? l===0 : (c.doorPos!=="right");
        const hx=hingeLeft?lx+2:lx+lw-2, ox=hingeLeft?lx+lw-2:lx+2;
        if(c.door!=="sliding"){o+=`<polyline points="${ox},${dTop+2} ${hx},${(dTop+yF)/2} ${ox},${yF-2}" fill="none" style="stroke:var(--dim)" stroke-width="1" stroke-dasharray="4 3"/>`}
        const px=hingeLeft?lx+lw-9:lx+9;
        o+=`<rect x="${px-1.5}" y="${yF-4.2*s}" width="3" height="${1.6*s}" rx="1.5" fill="${fc}"/>`;
      }
      if(c.door==="sliding"){
        o+=`<line x1="${x-pw*.6}" y1="${dTop-6}" x2="${x+pw}" y2="${dTop-6}" stroke="${fc}" stroke-width="2.5"/>`;
        o+=`<path d="M${x+pw*.25} ${dTop+16} h${-pw*.35}" style="stroke:var(--dim)" stroke-width="1.4" fill="none"/><path d="M${x+pw*.25-pw*.35} ${dTop+16} l7 -4 v8z" style="fill:var(--dim)"/>`;
      }
    }
    x+=pw;
  });
  if(c.system==="frameless"){o+=`<rect x="${x0}" y="${y0}" width="${W}" height="4" fill="${fc}"/><rect x="${x0}" y="${yF-4}" width="${W}" height="4" fill="${fc}"/>`}
  if(opt.overlay)return o+"</svg>";
  const dy=yF+30;
  o+=`<g style="stroke:var(--dim)" stroke-width="1"><line x1="${x0}" y1="${yF+14}" x2="${x0}" y2="${dy+6}"/><line x1="${x0+W}" y1="${yF+14}" x2="${x0+W}" y2="${dy+6}"/><line x1="${x0}" y1="${dy}" x2="${x0+W}" y2="${dy}"/>
  <line x1="${x0-4}" y1="${dy+4}" x2="${x0+4}" y2="${dy-4}"/><line x1="${x0+W-4}" y1="${dy+4}" x2="${x0+W+4}" y2="${dy-4}"/></g>`;
  o+=`<text x="${x0+W/2}" y="${dy-6}" text-anchor="middle" style="fill:var(--dim);font:${opt.small?14:12}px var(--mono)">${ftin(c.w)}</text>`;
  const dx=x0+W+26;
  o+=`<g style="stroke:var(--dim)" stroke-width="1"><line x1="${x0+W+8}" y1="${y0}" x2="${dx+6}" y2="${y0}"/><line x1="${x0+W+8}" y1="${yF}" x2="${dx+6}" y2="${yF}"/><line x1="${dx}" y1="${y0}" x2="${dx}" y2="${yF}"/>
  <line x1="${dx-4}" y1="${y0+4}" x2="${dx+4}" y2="${y0-4}"/><line x1="${dx-4}" y1="${yF+4}" x2="${dx+4}" y2="${yF-4}"/></g>`;
  o+=`<text x="${dx+10}" y="${(y0+yF)/2}" text-anchor="middle" transform="rotate(-90 ${dx+10} ${(y0+yF)/2})" style="fill:var(--dim);font:${opt.small?14:12}px var(--mono)">${ftin(c.h)}</text>`;
  return o+"</svg>";
}
function specRows(c){
  const e=estimate(c), n=panelsOf(c).length;
  return [[t("sSystem"),L(SYSTEMS[c.system].label)],[t("sGlass"),L(GLASS[c.glass].label)+t("mm10")],[t("sFinish"),L(FINISH[c.finish].label)],[t("sDoor"),L(DOOR[c.door].label)],...(c.door!=="none"?[[t("sDoorPos"),L(DOORPOS[c.doorPos||"center"].label)]]:[]),
    [t("sBand"),c.band&&c.glass!=="frosted"?t("yes"):t("no")],[t("sSize"),`${ftin(c.w)} × ${ftin(c.h)}`],[t("sArea"),`${e.area.toFixed(0)} ft²`],[t("sPanels"),n]];
}

async function loadPhoto(file){
  if(!file)return;
  if(!/^image\//.test(file.type)){setSpcMsg("notImage");return}
  const blob=await downscale(file);
  frame=DEF_FRAME.map(p=>[...p]);resetSegs();rec=null;autoW=false;renderRec();
  setPhoto(blob);
  await createProject(blob);
  setSpcMsg(aiReady?"photoReadyAi":"photoReadyRule");
}
async function downscale(file){
  const url=URL.createObjectURL(file);
  try{const img=await loadImg(url), sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement("canvas");cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",.88));
  }catch(e){return file}finally{URL.revokeObjectURL(url)}
}

const fr2o=f=>(f||[]).map(q=>Array.isArray(q)?{x:+q[0],y:+q[1]}:{x:+q.x,y:+q.y}), o2fr=a=>(a||[]).map(q=>Array.isArray(q)?[+q[0],+q[1]]:[+q.x,+q.y]);

// --- projective math (homography from 4 point pairs) ---
function adj(m){return [m[4]*m[8]-m[5]*m[7],m[2]*m[7]-m[1]*m[8],m[1]*m[5]-m[2]*m[4],m[5]*m[6]-m[3]*m[8],m[0]*m[8]-m[2]*m[6],m[2]*m[3]-m[0]*m[5],m[3]*m[7]-m[4]*m[6],m[1]*m[6]-m[0]*m[7],m[0]*m[4]-m[1]*m[3]]}
function mm(a,b){const c=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){let v=0;for(let k=0;k<3;k++)v+=a[3*i+k]*b[3*k+j];c.push(v)}return c}
function mv(m,v){return [m[0]*v[0]+m[1]*v[1]+m[2]*v[2],m[3]*v[0]+m[4]*v[1]+m[5]*v[2],m[6]*v[0]+m[7]*v[1]+m[8]*v[2]]}
function basis(p){const m=[p[0][0],p[1][0],p[2][0],p[0][1],p[1][1],p[2][1],1,1,1];const v=mv(adj(m),[p[3][0],p[3][1],1]);return mm(m,[v[0],0,0,0,v[1],0,0,0,v[2]])}
function homography(src,dst){const h=mm(basis(dst),adj(basis(src)));return h.map(x=>x/h[8])}
function applyH(h,x,y){const r=mv(h,[x,y,1]);return [r[0]/r[2],r[1]/r[2]]}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
// width/height ratio of the framed wall as seen in the photo (averages opposite edges, in px)
function frameRatio(){
  const Wp=photo.naturalWidth||1, Hp=photo.naturalHeight||1;
  const P=frame.map(([x,y])=>[x*Wp/100,y*Hp/100]);
  const wTop=dist(P[0],P[1]), wBot=dist(P[2],P[3]), hL=dist(P[0],P[2]), hR=dist(P[1],P[3]);
  return ((wTop+wBot)/2)/Math.max(1,(hL+hR)/2);
}
function convexOK(f){
  const P=[f[0],f[1],f[3],f[2]];let sign=0;
  for(let i=0;i<4;i++){const a=P[i],b=P[(i+1)%4],c=P[(i+2)%4];const z=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(Math.abs(z)<1e-6)return false;const sg=Math.sign(z);if(sign&&sg!==sign)return false;sign=sg}
  return true;
}

function paint(stageEl,ovEl,c,fr=frame){
  const r=stageEl.getBoundingClientRect(), Wp=r.width, Hp=r.height;
  if(!Wp||!Hp)return false;
  const bw0=400, bh0=400*c.h/c.w;
  ovEl.hidden=false;ovEl.style.width=bw0+"px";ovEl.style.height=bh0+"px";
  ovEl.innerHTML=render(c,{overlay:true});
  const h=homography([[0,0],[bw0,0],[0,bh0],[bw0,bh0]],fr.map(([x,y])=>[x*Wp/100,y*Hp/100]));
  ovEl.style.transform=`matrix3d(${h[0]},${h[3]},0,${h[6]},${h[1]},${h[4]},0,${h[7]},0,0,1,0,${h[2]},${h[5]},0,${h[8]})`;
  return true;
}
function paintOthers(stageEl,activeEl,clickable){
  let box=stageEl.querySelector(".ovs");
  if(!box){box=document.createElement("div");box.className="ovs";stageEl.insertBefore(box,activeEl)}
  const r=stageEl.getBoundingClientRect();if(!r.width)return;
  const others=segs.map((sg,i)=>i).filter(i=>i!==act);
  while(box.children.length>others.length)box.lastChild.remove();
  while(box.children.length<others.length){const d=document.createElement("div");d.className="ov other";if(clickable)d.addEventListener("click",()=>selectSeg(+d.dataset.seg));box.appendChild(d)}
  others.forEach((i,k)=>{const el=box.children[k];el.dataset.seg=i;el.title=t("seg")+" "+LETTERS[i];paint(stageEl,el,segCfg(i),segs[i].frame)});
  let tags=stageEl.querySelector(".segtags");
  if(!tags){tags=document.createElement("div");tags.className="segtags";stageEl.appendChild(tags)}
  tags.innerHTML=segs.length>1?segs.map((sg,i)=>{const f=i===act?frame:sg.frame;const x=Math.min(f[0][0],f[2][0]),y=Math.min(f[0][1],f[1][1]);return `<span class="segtag${i===act?" on":""}" style="left:${x}%;top:${y}%">${LETTERS[i]}</span>`}).join(""):"";
}

let drag=null;
function startDrag(e,mode){
  const r=stage.getBoundingClientRect();
  drag={mode,sx:e.clientX,sy:e.clientY,W:r.width,H:r.height,f0:frame.map(p=>[...p])};
  try{e.currentTarget.setPointerCapture(e.pointerId)}catch(x){}
  e.preventDefault();
}
function moveDrag(e){
  if(!drag)return;
  const dx=(e.clientX-drag.sx)/drag.W*100, dy=(e.clientY-drag.sy)/drag.H*100;
  let nf=drag.f0.map(p=>[...p]);
  if(drag.mode==="all"){
    const xs=nf.map(p=>p[0]),ys=nf.map(p=>p[1]);
    const ddx=clamp(dx,-Math.min(...xs),100-Math.max(...xs)), ddy=clamp(dy,-Math.min(...ys),100-Math.max(...ys));
    nf=nf.map(([x,y])=>[x+ddx,y+ddy]);
  }else{const i=drag.mode;nf[i]=[clamp(drag.f0[i][0]+dx,0,100),clamp(drag.f0[i][1]+dy,0,100)]}
  if(convexOK(nf)){frame=nf;drawOverlay()}
}
function endDrag(){if(drag){drag=null;refit()}}

// Warp a source canvas onto a quadrilateral of a destination canvas (per-pixel inverse mapping, bilinear)
function drawWarped(ctx,srcCanvas,dst){
  const iw=srcCanvas.width, ih=srcCanvas.height, src=srcCanvas.getContext("2d").getImageData(0,0,iw,ih).data;
  const inv=homography(dst,[[0,0],[iw,0],[0,ih],[iw,ih]]);
  const xs=dst.map(p=>p[0]), ys=dst.map(p=>p[1]);
  const x0=Math.max(0,Math.floor(Math.min(...xs))), x1=Math.min(ctx.canvas.width,Math.ceil(Math.max(...xs)));
  const y0=Math.max(0,Math.floor(Math.min(...ys))), y1=Math.min(ctx.canvas.height,Math.ceil(Math.max(...ys)));
  const W=x1-x0, H=y1-y0; if(W<=0||H<=0)return;
  const layer=new ImageData(W,H), out=layer.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const X=x0+x+.5, Y=y0+y+.5, d=inv[6]*X+inv[7]*Y+inv[8];
    const u=(inv[0]*X+inv[1]*Y+inv[2])/d-.5, v=(inv[3]*X+inv[4]*Y+inv[5])/d-.5;
    if(u<-.5||v<-.5||u>iw-.5||v>ih-.5)continue;
    const ux=Math.max(0,Math.min(iw-1,u)), vy=Math.max(0,Math.min(ih-1,v));
    const xa=Math.floor(ux), ya=Math.floor(vy), xb=Math.min(iw-1,xa+1), yb=Math.min(ih-1,ya+1), fx=ux-xa, fy=vy-ya;
    const o=(y*W+x)*4;
    for(let k=0;k<4;k++){
      const p=src[(ya*iw+xa)*4+k]*(1-fx)*(1-fy)+src[(ya*iw+xb)*4+k]*fx*(1-fy)+src[(yb*iw+xa)*4+k]*(1-fx)*fy+src[(yb*iw+xb)*4+k]*fx*fy;
      out[o+k]=p;
    }
  }
  const lc=document.createElement("canvas");lc.width=W;lc.height=H;lc.getContext("2d").putImageData(layer,0,0);
  ctx.drawImage(lc,x0,y0);
}


function numOr(id,def,a,b){const v=parseFloat(document.getElementById(id).value);return isNaN(v)?def:clamp(v,a,b)}
function ruleDesign(){
  const p=PRESETS.find(x=>x.id===SPACES[sp.space].preset), c={...p.cfg}, why=[{k:"whyBase",preset:p.id,space:sp.space}];
  if(sp.style==="industrial"){c.system="loft";c.finish="black";why.push({k:"whyIndustrial"})}
  else if(sp.style==="warm"){c.finish="bronze";if(c.system==="loft")c.system="frameless";why.push({k:"whyWarm"})}
  else if(sp.style==="modern"){if(c.system!=="modular")c.system="frameless";if(c.finish==="bronze")c.finish="black";why.push({k:"whyModern"})}
  else {if(c.system==="loft")c.system="framed";c.finish="silver";why.push({k:"whyCorporate"})}
  if(sp.priv==="high"){c.glass=sp.style==="warm"?"fluted":"frosted";c.band=false;why.push({k:c.glass==="fluted"?"whyHighFluted":"whyHighFrosted"})}
  else if(sp.priv==="mid"){if(c.glass==="frosted")c.glass="clear";c.band=c.glass!=="fluted";if(c.band)why.push({k:"whyMidBand"})}
  else {c.band=false;if(c.glass==="frosted"||c.glass==="fluted")c.glass="lowiron";why.push({k:"whyLow"})}
  c.doorPos="center";
  c.h=numOr("sh",sp.space==="home"?8:9,7,12);
  const hasW=document.getElementById("sw").value!=="";
  let autoW=false;
  if(hasW)c.w=numOr("sw",c.w,6,40);
  else if(photoURL){c.w=clamp(Math.round(c.h*frameRatio()*2)/2,6,40);autoW=true}
  fitDoor(c);
  if(photoURL||hasW)why.push({k:"whyFrame"});
  return {type:"rule",cfg:c,src:{type:"rule",space:sp.space,style:sp.style,adj:false},why,autoW};
}
// keep the door sensible for the available width
function fitDoor(c){if(c.door==="double"&&c.w<10)c.door="swing";if(c.door!=="none"&&c.w<5)c.door="none"}
function whyText(w,r){
  if(typeof w==="string")return w;
  if(w.k==="whyFrame"){const c=r.cfg;return t("whyFrame",{w:ftin(c.w),h:ftin(c.h),n:panelsOf(c).length})}
  if(w.k==="detected"&&r.det)return t("detected",{s:L(SPACES[r.det.space].label),pr:L(PRIV[r.det.priv].label).split(" ·")[0].toLowerCase(),st:L(STYLE[r.det.style].label).toLowerCase()});

  return t(w.k);
}

function money2(n){return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function lineItems(cs){
  if(!Array.isArray(cs))cs=[cs];
  const low=x=>lang==="es"?L(x).toLowerCase():L(x);
  const out=[];
  cs.forEach((c,i)=>{
    const area=c.w*c.h, s=SYSTEMS[c.system], g=GLASS[c.glass], f=FINISH[c.finish], d=DOOR[c.door];
    const pre=cs.length>1?`${t("seg")} ${LETTERS[i]} (${ftin(c.w)} × ${ftin(c.h)}) · `:"";
    const sys=area*s.rate; out.push({d:pre+t("liSystem",{x:low(s.label)}),q:`${area.toFixed(0)} ft² × $${s.rate}`,a:sys});
    if(g.add)out.push({d:pre+t("liGlass",{x:low(g.label)}),q:`${area.toFixed(0)} ft² × $${g.add}`,a:area*g.add});
    if(f.mult>1)out.push({d:pre+t("liFinish",{x:low(f.label)}),q:`+${Math.round((f.mult-1)*100)}%`,a:(sys+area*g.add)*(f.mult-1)});
    if(d.cost)out.push({d:pre+t("liDoor",{x:low(d.label)})+` · ${L(DOORPOS[c.doorPos||"center"].label).toLowerCase()}`,q:"1",a:d.cost});
    if(c.band&&c.glass!=="frosted")out.push({d:pre+t("liBand"),q:t("liBandQ",{n:c.w}),a:c.w*BAND_LF});
  });
  if(cs.length>1)out.push({d:t("liJoint"),q:String(cs.length-1),a:JOINT*(cs.length-1)});
  const sub=out.reduce((x,y)=>x+y.a,0);
  if(sub<MIN_PROJECT)out.push({d:t("liMin"),q:"",a:MIN_PROJECT-sub});
  out.forEach(x=>x.a=Math.round(x.a*100)/100);
  return out;
}
const PRINT={"--muted":"#7a8a89","--ink":"#14201f","--dim":"#2f6f8f","--mono":"'Courier New',monospace"};
function printSVG(c){return render(c).replace(/var\((--[a-z]+)\)/g,(m,k)=>PRINT[k]||"#333").replace("</defs>",'</defs><rect width="620" height="330" fill="#f1f4f3"/>')}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function svgToPng(svg,scale=2.5){
  const img=await loadImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg.replace("<svg ",'<svg width="620" height="330" ')));
  const cv=document.createElement("canvas");cv.width=620*scale;cv.height=330*scale;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL("image/png");
}
async function compositeJPG(cs,frs){
  if(!photoURL)return null;
  const img=await loadImg(photoURL), sc=Math.min(1,1400/img.naturalWidth);
  const cv=document.createElement("canvas");cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);
  const x=cv.getContext("2d");x.drawImage(img,0,0,cv.width,cv.height);
  for(let i=0;i<cs.length;i++){
    const c=cs[i], ow=900, oh=Math.round(900*c.h/c.w);
    const svg=render(c,{overlay:true}).replace(/var\((--[a-z]+)\)/g,(m,k)=>PRINT[k]||"#333").replace("<svg ",`<svg width="${ow}" height="${oh}" `);
    const ovi=await loadImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg));
    const oc=document.createElement("canvas");oc.width=ow;oc.height=oh;oc.getContext("2d").drawImage(ovi,0,0,ow,oh);
    drawWarped(x,oc,frs[i].map(([px,py])=>[px*cv.width/100,py*cv.height/100]));
  }
  return {src:cv.toDataURL("image/jpeg",.85),w:cv.width,h:cv.height};
}

function segSpecs(c){return specRows(c).filter(([a])=>a!==t("sSystem")&&a!==t("sGlass")&&a!==t("sFinish"))}

}
function specsHTML(cs){
  const c0=cs[0], shared=[[t("sSystem"),L(SYSTEMS[c0.system].label)],[t("sGlass"),L(GLASS[c0.glass].label)+t("mm10")],[t("sFinish"),L(FINISH[c0.finish].label)]];
  if(cs.length===1)return `<div class="specs">${specRows(c0).map(([a,b])=>`<span><b>${a}:</b> ${b}</span>`).join("")}</div>`;
  return `<div class="specs">${shared.map(([a,b])=>`<span><b>${a}:</b> ${b}</span>`).join("")}</div>`+cs.map((c,i)=>`<div class="specs"><span><b>${t("seg")} ${LETTERS[i]}</b></span>${segSpecs(c).map(([a,b])=>`<span>${a}: ${b}</span>`).join("")}</div>`).join("");

async function buildPDF(d){
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"pt",format:"letter"});
  const W=612,M=40,iw=W-2*M; let y=M;
  const teal=[15,43,76], ink=[22,35,47], mute=[84,101,118];
  const clean=s=>String(s).replace(/′/g,"'").replace(/″/g,'"').replace(/[–—]/g,"-").replace(/[“”]/g,'"');
  const T=(s,x,yy,o={})=>{pdf.setFont("helvetica",o.b?"bold":"normal");pdf.setFontSize(o.s||10);pdf.setTextColor(...(o.c||ink));pdf.text(clean(s),x,yy,o.r?{align:"right"}:undefined)};
  const wrap=(s,x,width,size,color,lh)=>{pdf.setFont("helvetica","normal");pdf.setFontSize(size);pdf.setTextColor(...color);const ls=pdf.splitTextToSize(clean(s),width);pdf.text(ls,x,y);return ls.length*lh};
  T(BIZ.name,M,y+6,{b:1,s:16});T(t("dSub")+" · "+BIZ.area,M,y+22,{c:mute,s:9});T(BIZ.phone+" · "+BIZ.web,M,y+34,{c:mute,s:9});
  T(t("dTitle"),W-M,y+8,{b:1,s:18,c:teal,r:1});T(t("dNo")+" "+d.num,W-M,y+22,{s:9,r:1});T(t("dDate")+": "+d.date,W-M,y+33,{s:9,r:1});T(t("dValid")+": "+d.valid,W-M,y+44,{s:9,r:1});
  y+=54;pdf.setDrawColor(201,154,59);pdf.setLineWidth(2);pdf.line(M,y,W-M,y);y+=20;
  T(t("dFor").toUpperCase(),M,y,{s:8,c:mute});y+=14;
  T(d.client.name,M,y,{b:1,s:11});T(d.client.phone+(d.client.email?"   ·   "+d.client.email:""),M+230,y,{s:10});y+=14;
  T((d.client.city||"—")+"   ·   "+d.space,M,y,{s:10,c:mute});y+=22;
  T(t("dDesign").toUpperCase(),M,y,{s:8,c:mute});y+=14;T(d.name,M,y,{b:1,s:12});y+=8;
  const cs=d.cfgs||[d.cfg];
  if(cs.length===1){
    const png=await svgToPng(printSVG(cs[0])), ih=iw*330/620;
    pdf.addImage(png,"PNG",M,y,iw,ih);pdf.setDrawColor(217,226,225);pdf.setLineWidth(.6);pdf.rect(M,y,iw,ih);y+=ih+14;
    y+=wrap(specRows(cs[0]).map(([a,b])=>`${a}: ${b}`).join("   ·   "),M,iw,9,mute,11)+12;
  }else{
    const gw=(iw-12)/2, gh=gw*330/620;
    for(let i=0;i<cs.length;i++){
      const col=i%2, gx=M+col*(gw+12);
      if(col===0&&i>0)y+=gh+30;
      T(`${t("seg")} ${LETTERS[i]} · ${ftin(cs[i].w)} × ${ftin(cs[i].h)}`,gx,y+8,{s:8.5,b:1});
      const png=await svgToPng(printSVG(cs[i]));
      pdf.addImage(png,"PNG",gx,y+14,gw,gh);pdf.setDrawColor(217,226,225);pdf.setLineWidth(.6);pdf.rect(gx,y+14,gw,gh);
    }
    y+=gh+30;
    y+=wrap([[t("sSystem"),L(SYSTEMS[cs[0].system].label)],[t("sGlass"),L(GLASS[cs[0].glass].label)],[t("sFinish"),L(FINISH[cs[0].finish].label)]].map(([a,b])=>`${a}: ${b}`).join("   ·   "),M,iw,9,mute,11)+4;
    cs.forEach((c,i)=>{y+=wrap(`${t("seg")} ${LETTERS[i]}: `+segSpecs(c).map(([a,b])=>`${a}: ${b}`).join("  ·  "),M,iw,9,mute,11)+2});
    y+=10;
    if(y>520){pdf.addPage();y=M}
  }
  T(t("dDesc").toUpperCase(),M,y,{s:8,c:mute});T(t("dQty").toUpperCase(),M+300,y,{s:8,c:mute});T(t("dAmt").toUpperCase(),W-M,y,{s:8,c:mute,r:1});y+=5;pdf.setDrawColor(...ink);pdf.setLineWidth(.8);pdf.line(M,y,W-M,y);y+=14;
  d.lines.forEach(l=>{const h=wrap(l.d,M,290,10,ink,12);T(l.q,M+300,y,{s:10});T(money2(l.a),W-M,y,{s:10,r:1});y+=h+4;pdf.setDrawColor(225,232,231);pdf.setLineWidth(.5);pdf.line(M,y,W-M,y);y+=13});
  y+=4;T(t("dTotal"),M,y,{b:1,s:13});T(money2(d.total),W-M,y,{b:1,s:13,r:1});y+=14;
  T(`${t("dRange")}: ${fmt(d.total*.88)} - ${fmt(d.total*1.12)}`,W-M,y,{s:9,c:mute,r:1});y+=18;
  if(d.notes){T(t("dNotes").toUpperCase(),M,y,{s:8,c:mute});y+=12;y+=wrap(d.notes,M,iw,9,ink,11)+8}
  if(y>650){pdf.addPage();y=M}
  T(t("dTerms").toUpperCase(),M,y,{s:8,c:mute});y+=12;
  t("terms").forEach(x=>{y+=wrap("•  "+x,M,iw,8.5,mute,10.5)+2});
  const fy=752;
  const foot=()=>{pdf.setDrawColor(217,226,225);pdf.setLineWidth(.6);pdf.line(M,fy-12,W-M,fy-12);T(BIZ.name+" · "+BIZ.phone,M,fy,{s:8,c:mute});T(t("dSign")+": ______________________",W-M,fy,{s:8,c:mute,r:1})};
  foot();
  if(d.photo){
    pdf.addPage();y=M;
    T(t("dVis").toUpperCase(),M,y+6,{s:8,c:mute});T(t("fileWord")+" "+d.num,W-M,y+6,{s:8,c:mute,r:1});y+=18;
    T(d.name,M,y,{b:1,s:12});y+=12;
    let pw=iw, ph=pw*d.photo.h/d.photo.w; if(ph>600){ph=600;pw=ph*d.photo.w/d.photo.h}
    pdf.addImage(d.photo.src,"JPEG",M+(iw-pw)/2,y,pw,ph);y+=ph+14;
    y+=wrap(t("dVisNote"),M,iw,8.5,mute,10.5);
    foot();
  }
  return pdf.output("blob");
}

function fileBase(){return `${t("fileWord")}-${current.num}-${current.client.name.replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"")}`}
async function save(filename,data){
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".html")?"text/html;charset=utf-8":"application/octet-stream"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url;a.download=filename;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    setToast("saved",{f:filename});
  }catch(e){setToast("saveFail")}
}
document.getElementById("dlHtml").addEventListener("click",()=>{if(current)save(fileBase()+".html",docHTML(view(current)))});
document.getElementById("dlPdf").addEventListener("click",async()=>{

document.getElementById("copy").addEventListener("click",()=>{

// ================= projects: cloud (db + assets) with on-device fallback =================
// Each project: {id, where:"cloud"|"local", name, nameAuto, created, updated, cfg, src, frame, sp, rec, autoW, photoId (cloud) | photo Blob (local)}
let projects=[], curProj=null, saveTimer=null, idb=null, localOK=false, cloud=null, assetsNS=null, cloudUnsub=null, writeChain=Promise.resolve();
const deleted=new Set();
const DEV=Math.random().toString(36).slice(2,10);
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open("hgd-gp",1);r.onupgradeneeded=()=>r.result.createObjectStore("projects",{keyPath:"id"});r.onsuccess=()=>{idb=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})}
function idbDo(mode,fn){return new Promise((res,rej)=>{try{const tx=idb.transaction("projects",mode),q=fn(tx.objectStore("projects"));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}catch(e){rej(e)}})}
function body(pr){const {id,where,photo,_sig,...rest}=pr;const b=JSON.parse(JSON.stringify({...rest,dev:DEV}));
  if(b.frame)b.frame=fr2o(b.frame);if(b.segs)b.segs=b.segs.map(sg=>({spec:sg.spec,frame:fr2o(sg.frame)}));return b}
async function persist(pr){
  if(deleted.has(pr.id))return true;
  if(pr.where==="cloud"&&cloud){
    const b=body(pr);
    writeChain=writeChain.then(()=>deleted.has(pr.id)?null:cloud.doc("projects/"+pr.id).set(b)).then(()=>true,async e=>{
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await cloud.doc("projects/"+pr.id).set(b);return true}catch(x){}}
      return false});
    return writeChain;
  }
  if(localOK){try{await idbDo("readwrite",st=>st.put({...pr,where:"local"}));return true}catch(e){return false}}
  return false;
}
function snapshot(pr){storeActive();Object.assign(pr,{cfg:{...cfg},src:{...cfgSrc},frame:cpF(frame),segs:segs.map(sg=>({spec:{...sg.spec},frame:cpF(sg.frame)})),act,sp:{...sp},rec,autoW,updated:Date.now()})}
function timeStr(){return new Date().toLocaleTimeString(lang==="es"?"es-US":"en-US",{hour:"numeric",minute:"2-digit"})}
function savedMsg(pr,ok){document.getElementById("projSaved").textContent=!ok?t(pr.where==="cloud"?"cloudFail":"storageOff"):t(pr.where==="cloud"?"savedCloud":"savedLocal",{t:timeStr()})}
function sigOf(pr){const b=body(pr);delete b.updated;delete b.dev;return JSON.stringify(b)}
function markClean(pr){const tmp={...pr};snapshot(tmp);pr._sig=sigOf(tmp)}
function scheduleSave(force){
  if(!curProj)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    saveTimer=null;
    const pr=projects.find(x=>x.id===curProj);if(!pr||deleted.has(pr.id))return;
    const prev=pr.updated;snapshot(pr);
    const sig=sigOf(pr);
    if(!force&&sig===pr._sig){pr.updated=prev;return}
    pr._sig=sig;savedMsg(pr,await persist(pr));
  },700);
}
function newId(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
// upload a photo to the artifact's cloud storage; resolves the asset id or null
async function uploadPhoto(blob){
  if(!assetsNS||!cloud)return null;
  try{return (await assetsNS.upload(blob,{type:"image/jpeg"})).id}
  catch(e){if(e&&e.code==="store_unavailable"){await new Promise(r=>setTimeout(r,800));try{return (await assetsNS.upload(blob,{type:"image/jpeg"})).id}catch(x){}}return null}
}
async function createProject(blob){
  const now=new Date();
  const pr={id:newId(),created:now.getTime(),nameAuto:true,
    name:t("projDefault",{n:projects.length+1,d:now.toLocaleDateString(lang==="es"?"es-US":"en-US",{day:"numeric",month:"short"})})};
  cfg={...DEFAULT};cfgSrc={type:"custom",adj:false};resetSegs();
  if(cloud){
    document.getElementById("projSaved").textContent=t("uploading");
    const pid=await uploadPhoto(blob);
    if(pid){pr.where="cloud";pr.photoId=pid}else{pr.where="local";pr.photo=blob;document.getElementById("projSaved").textContent=t("uploadFail")}
  }else{pr.where="local";pr.photo=blob}
  snapshot(pr);pr._sig=sigOf(pr);projects.unshift(pr);curProj=pr.id;
  try{localStorage.setItem("hgd-gp-cur",curProj)}catch(e){}
  syncInputs();update();renderProjBar();
  const ok=await persist(pr);
  if(!(pr.where==="local"&&cloud))savedMsg(pr,ok);
}
function photoOf(pr){return pr.photoId?{url:"/_blob/"+pr.photoId}:pr.photo?{blob:pr.photo}:null}
function openProject(id){
  const pr=projects.find(x=>x.id===id);if(!pr)return;
  curProj=id;try{localStorage.setItem("hgd-gp-cur",id)}catch(e){}
  frame=pr.frame?o2fr(pr.frame):cpF(DEF_FRAME);
  cfg={...DEFAULT,...pr.cfg};
  if(Array.isArray(pr.segs)&&pr.segs.length){segs=pr.segs.map(sg=>({spec:{...sg.spec},frame:o2fr(sg.frame)}));act=clamp(pr.act||0,0,segs.length-1);loadActive()}else resetSegs();cfgSrc={...(pr.src||{type:"custom"})};sp={...sp,...(pr.sp||{})};rec=pr.rec||null;autoW=!!pr.autoW;
  const ph=photoOf(pr);
  markClean(pr);
  buildSpChips();setPhoto(ph&&ph.blob,ph&&ph.url);syncInputs();update();renderProjBar();
  document.getElementById("projSaved").textContent="";
}
function newProject(){
  curProj=null;try{localStorage.removeItem("hgd-gp-cur")}catch(e){}
  frame=DEF_FRAME.map(p=>[...p]);rec=null;autoW=false;cfg={...DEFAULT};cfgSrc={type:"preset",id:"exec",adj:false};resetSegs();
  setPhoto(null);syncInputs();update();renderProjBar();setSpcMsg(null,"");
  document.getElementById("projSaved").textContent="";
  showTab("spc");
}
function renderProjBar(){
  const bar=document.getElementById("projbar"), sel=document.getElementById("projSel");
  bar.hidden=!projects.length&&!cloud;
  sel.innerHTML=(curProj?"":`<option value="">— ${esc(t("newProject"))} —</option>`)+projects.map(p=>`<option value="${p.id}">${p.where==="local"&&cloud?"⚠ ":""}${esc(p.name)}</option>`).join("");
  sel.value=curProj||"";
  ["projRename","projDel"].forEach(id=>{const b=document.getElementById(id);b.disabled=!curProj;b.title=curProj?"":t("needProject")});
  const badge=document.getElementById("syncBadge");
  badge.textContent=t(cloud?"syncCloud":"syncLocal");badge.dataset.mode=cloud?"cloud":"local";
}
document.getElementById("syncBadge").addEventListener("click",async()=>{
  const out=document.getElementById("projSaved");
  if(!cloud){out.textContent=t("localInfo");return}
  out.textContent=t("syncing");
  try{
    if(curProj&&saveTimer){clearTimeout(saveTimer);saveTimer=null;const pr=projects.find(x=>x.id===curProj);if(pr){snapshot(pr);pr._sig=sigOf(pr);await persist(pr)}}
    await writeChain;
    const snap=await cloud.collection("projects").orderBy("updated","desc").limit(200).get();
    const n=snap.docs.filter(d=>!deleted.has(d.id)).length;
    out.textContent=t("synced",{n,t:timeStr()});
  }catch(e){out.textContent=t("cloudFail")}
});
document.getElementById("projSel").addEventListener("change",e=>{if(e.target.value)openProject(e.target.value)});
document.getElementById("projNew").addEventListener("click",newProject);
const projName=document.getElementById("projName");
document.getElementById("projRename").addEventListener("click",()=>{
  const pr=projects.find(x=>x.id===curProj);if(!pr)return;
  projName.value=pr.name;projName.hidden=false;document.getElementById("projSel").hidden=true;projName.focus();projName.select();
});
function finishRename(commit){
  if(projName.hidden)return;
  const pr=projects.find(x=>x.id===curProj), v=projName.value.trim();
  if(commit&&pr&&v&&v!==pr.name){pr.name=v.slice(0,60);pr.nameAuto=false;scheduleSave(true);document.getElementById("projSaved").textContent=t("renamed")}
  projName.hidden=true;document.getElementById("projSel").hidden=false;renderProjBar();
}
projName.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();finishRename(true)}else if(e.key==="Escape")finishRename(false)});
projName.addEventListener("blur",()=>finishRename(true));
document.getElementById("projDel").addEventListener("click",()=>{document.getElementById("projBtns").hidden=true;document.getElementById("projConfirm").hidden=false});
document.getElementById("projDelNo").addEventListener("click",()=>{document.getElementById("projBtns").hidden=false;document.getElementById("projConfirm").hidden=true});
document.getElementById("projDelYes").addEventListener("click",async()=>{
  document.getElementById("projBtns").hidden=false;document.getElementById("projConfirm").hidden=true;
  const pr=projects.find(x=>x.id===curProj);if(!pr)return;
  clearTimeout(saveTimer);saveTimer=null;
  deleted.add(pr.id);
  projects=projects.filter(x=>x.id!==pr.id);
  const name=pr.name;
  curProj=null;
  if(projects.length)openProject(projects[0].id);else newProject();
  let ok=true;
  if(pr.where==="cloud"&&cloud){
    writeChain=writeChain.catch(()=>{}).then(()=>cloud.doc("projects/"+pr.id).delete());
    try{await writeChain;if(pr.photoId&&assetsNS)await assetsNS.delete(pr.photoId).catch(()=>{})}
    catch(e){ok=false;deleted.delete(pr.id)}
    writeChain=writeChain.catch(()=>{});
  }else if(localOK){try{await idbDo("readwrite",st=>st.delete(pr.id))}catch(e){ok=false}}
  document.getElementById("projSaved").textContent=ok?t("deletedMsg",{n:name}):t("cloudFail");
});
SPOPTS.forEach(([id])=>document.getElementById(id).addEventListener("change",()=>scheduleSave()));

// live list from the cloud; reload the open project when another device changed it
function onCloudSnap(snap){
  const cloudList=snap.docs.filter(d=>!deleted.has(d.id)).map(d=>({id:d.id,where:"cloud",...d.data()}));
  const local=projects.filter(p=>p.where==="local");
  const open=projects.find(p=>p.id===curProj);
  projects=[...cloudList.map(c=>{const mine=projects.find(p=>p.id===c.id);if(!mine)return c;
    if(c.id===curProj)return mine; // the open project is owned by this page; remote edits reload it below
    return (mine.updated||0)>(c.updated||0)?mine:c}),...local].sort((a,b)=>(b.updated||0)-(a.updated||0));
  const remote=snap.docChanges().find(ch=>ch.type==="modified"&&ch.doc.id===curProj&&!ch.doc.metadata.hasPendingWrites&&ch.doc.data().dev!==DEV);
  if(remote&&open&&!saveTimer&&(remote.doc.data().updated||0)>(open.updated||0)){const c=cloudList.find(x=>x.id===curProj);projects=projects.map(x=>x.id===curProj?c:x);openProject(curProj);document.getElementById("projSaved").textContent=t("remoteUpdated")}
  else if(curProj&&!projects.some(p=>p.id===curProj)&&!saveTimer){if(projects.length)openProject(projects[0].id);else{curProj=null;renderProjBar()}}
  else renderProjBar();
}
// move projects saved on this device into the cloud
async function migrateLocal(){
  const local=projects.filter(p=>p.where==="local"&&p.photo);let n=0;
  for(const pr of local){
    const pid=await uploadPhoto(pr.photo);if(!pid)continue;
    const moved={...pr,where:"cloud",photoId:pid};delete moved.photo;
    try{await cloud.doc("projects/"+pr.id).set(body(moved));}catch(e){continue}
    try{await idbDo("readwrite",st=>st.delete(pr.id))}catch(e){}
    projects=projects.map(p=>p.id===pr.id?moved:p);n++;
  }
  if(n){document.getElementById("projSaved").textContent=t("migrated",{n});if(local.some(p=>p.id===curProj))openProject(curProj)}
}

// configurator view: drawing vs photo
let cfgView="plan";
function setCfgView(v){
  cfgView=photoURL?v:"plan";
  document.getElementById("drawing").hidden=cfgView==="photo";
  cstage.hidden=cfgView!=="photo";document.getElementById("cstageAct").hidden=cfgView!=="photo";
  document.querySelectorAll("#viewSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===cfgView));
  document.getElementById("cfgLegend").textContent=t(cfgView==="photo"?"photoLegend2":"elevation");
  document.getElementById("cfgLegend2").textContent=t(cfgView==="photo"?"photoLegendR":"scaleNote");
  if(cfgView==="photo")requestAnimationFrame(()=>drawOverlay());
}
document.getElementById("viewSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setCfgView(b.dataset.view)});
document.getElementById("adjFrame").addEventListener("click",()=>showTab("spc"));

async function initProjects(){
  localOK=await idbOpen();
  if(localOK){try{projects=((await idbDo("readonly",st=>st.getAll()))||[]).map(p=>({...p,where:"local"}))}catch(e){projects=[]}}
  try{cloud=await window.claude?.use?.("db")}catch(e){cloud=null}
  try{assetsNS=await window.claude?.use?.("assets")}catch(e){assetsNS=null}
  if(cloud&&!assetsNS)cloud=null; // without photo storage, keep everything on this device
  if(cloud){
    try{
      const snap=await cloud.collection("projects").orderBy("updated","desc").limit(200).get();
      projects=[...snap.docs.map(d=>({id:d.id,where:"cloud",...d.data()})),...projects];
    }catch(e){cloud=null}
  }
  projects.sort((a,b)=>(b.updated||0)-(a.updated||0));
  let last=null;try{last=localStorage.getItem("hgd-gp-cur")}catch(e){}
  if(last&&projects.some(p=>p.id===last))openProject(last);
  renderProjBar();
  if(cloud){
    cloudUnsub=cloud.collection("projects").orderBy("updated","desc").limit(200).onSnapshot(onCloudSnap,()=>{});
    if(localOK)migrateLocal();
  }
}

// ================= tabs & language =================
function showTab(tab){
  if(tab==="spc"||tab==="cfg")requestAnimationFrame(()=>drawOverlay());
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  ["gal","spc","cfg","quo"].forEach(id=>document.getElementById(id).hidden=id!==tab);
  if(window.top!==window){try{parent.postMessage({hgdGp:"top"},"*")}catch(e){}}else window.scrollTo({top:0});
}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)showTab(b.dataset.tab)});

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=t(el.dataset.i18nPh)});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",t(el.dataset.i18nAria))});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  photo.alt=t("photoAlt");
  if(photoURL)document.getElementById("camLbl").textContent=t("takeAnother");
  if(spcMsgKey)spcMsg.textContent=t(spcMsgKey);
  if(!err.hidden)err.textContent=t("needContact");
  setToast(null);
  buildOpts();buildSpChips();renderQSpace();renderGallery();syncInputs();update();
  renderRec();
  renderPreview();renderProjBar();setCfgView(cfgView);updateSend();
}
document.querySelector(".lang").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;try{localStorage.setItem("hgd-gp-lang",lang)}catch(x){}
  applyLang();
});
applyLang();
initProjects();
if(window.top!==window&&window.ResizeObserver){let last=0;new ResizeObserver(()=>{const h=Math.ceil(document.documentElement.scrollHeight);if(Math.abs(h-last)>4){last=h;try{parent.postMessage({hgdGp:"h",h},"*")}catch(e){}}}).observe(document.body)}
